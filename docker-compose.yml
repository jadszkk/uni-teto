# Serviços de apoio para desenvolvimento local.
# A aplicação roda fora do Docker com `npm run dev`.
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: uniteto
      POSTGRES_PASSWORD: uniteto
      POSTGRES_DB: uniteto
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniteto"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Captura os e-mails enviados pela aplicação (ex: verificação de e-mail).
  # Interface web em http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
